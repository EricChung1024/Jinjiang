<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI3 南港美食 3D 午餐選擇器</title>
<style>
  /* 1. CSS Reset & Canvas 全螢幕佈局 */
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;color:#fff;
    font-family:-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    background:radial-gradient(circle at 62% 42%,#2f3478 0%,#16183f 55%,#0a0b1f 100%)}
  #canvas-container{position:absolute;inset:0;z-index:1;cursor:grab;touch-action:none}
  #canvas-container.dragging{cursor:grabbing}
  canvas{display:block}
  .hidden{display:none !important}

  /* 2. 控制面板 UI (Glassmorphism 玻璃擬態風格) */
  header{position:absolute;top:0;left:0;right:0;z-index:5;padding:14px 24px;
    display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;letter-spacing:.06em;
    background:linear-gradient(180deg,rgba(0,0,0,.4),transparent);pointer-events:none}
  header small{font-size:12px;font-weight:400;opacity:.65;letter-spacing:.03em}
  #ui-container{position:absolute;top:68px;left:20px;width:290px;max-height:calc(100% - 88px);overflow:auto;z-index:5;
    padding:18px;border-radius:20px;background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    box-shadow:0 12px 40px rgba(0,0,0,.35)}
  .group{margin-bottom:16px}
  .group h3{font-size:13px;font-weight:600;opacity:.8;margin-bottom:8px;letter-spacing:.08em}
  .opts{display:flex;flex-wrap:wrap;gap:6px}
  .opts label{position:relative;cursor:pointer;user-select:none}
  .opts input{position:absolute;opacity:0;pointer-events:none}
  .opts span{display:inline-block;padding:6px 12px;border-radius:999px;font-size:13px;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);transition:all .15s}
  .opts input:checked + span{background:linear-gradient(135deg,#ff8a5c,#ff5c8a);border-color:transparent;box-shadow:0 2px 10px rgba(255,92,138,.45)}
  .opts input:focus-visible + span{outline:2px solid #fff;outline-offset:2px}
  #count{font-size:14px;margin:4px 0 10px;padding:8px 12px;border-radius:12px;background:rgba(0,0,0,.25)}
  #count b{font-size:20px;color:#ffd166}
  #count.zero b{color:#ff6b6b}
  #hint{font-size:12px;color:#ffb3b3;margin-bottom:8px;min-height:16px}
  .btn{display:block;width:100%;border:0;cursor:pointer;color:#fff;font-size:16px;font-weight:700;letter-spacing:.1em;
    padding:13px;border-radius:14px;text-align:center;text-decoration:none;transition:transform .12s,filter .12s}
  .btn:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.1)}
  .btn:active:not(:disabled){transform:translateY(1px)}
  .btn-primary{background:linear-gradient(135deg,#ff8a5c,#ff4d8d);box-shadow:0 6px 20px rgba(255,77,141,.45)}
  .btn-primary:disabled{background:#555;box-shadow:none;cursor:not-allowed;opacity:.6}
  .btn-secondary{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);font-size:14px;padding:10px;font-weight:600;letter-spacing:.04em}
  .btn-nav{background:linear-gradient(135deg,#34c38f,#1a9bd7);font-size:15px}
  #note{margin-top:12px;font-size:11px;line-height:1.5;opacity:.55}

  /* 3. 結果彈窗與按鈕樣式 */
  #result-modal{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    background:rgba(5,6,20,.55);backdrop-filter:blur(4px);animation:fade .25s ease}
  .card{width:min(420px,calc(100% - 32px));padding:28px 26px 24px;border-radius:24px;text-align:center;
    background:rgba(30,32,80,.78);border:1px solid rgba(255,255,255,.28);
    box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
  .card .tag-top{font-size:13px;letter-spacing:.2em;opacity:.7}
  .card h2{font-size:30px;margin:8px 0 6px;line-height:1.25;text-shadow:0 2px 12px rgba(255,138,92,.6)}
  .card .dist{font-size:16px;color:#ffd166;margin-bottom:12px}
  .card .tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:12px}
  .card .tags span{font-size:12px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.14)}
  .card .memo{font-size:13px;opacity:.75;margin-bottom:16px;min-height:0}
  .card .actions{display:flex;flex-direction:column;gap:8px}
  .card .row{display:flex;gap:8px}
  .card .row .btn{flex:1}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
  #nowebgl{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px;font-size:16px;opacity:.9}

  @media (max-width:760px){
    header{font-size:16px;padding:10px 14px}
    #ui-container{top:auto;bottom:10px;left:10px;right:10px;width:auto;max-height:46%;padding:12px 14px}
    .group{margin-bottom:10px}
  }
</style>
<!-- 引進 Three.js CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <!-- 3D 畫布容器 -->
  <div id="canvas-container"></div>

  <header>🍜 AI3 南港午餐 3D 決策器 <small>以 AI3 股份有限公司（南港軟體園區）為中心・半徑 2 公里</small></header>

  <!-- 前端篩選 UI 層 -->
  <div id="ui-container">
    <div class="group">
      <h3>📍 距離選擇</h3>
      <div class="opts" id="f-dist">
        <label><input type="radio" name="dist" value="500"><span>500 公尺內</span></label>
        <label><input type="radio" name="dist" value="1000"><span>1 公里內</span></label>
        <label><input type="radio" name="dist" value="2000" checked><span>2 公里內</span></label>
      </div>
    </div>
    <div class="group">
      <h3>❄️ 環境條件</h3>
      <div class="opts"><label><input type="checkbox" id="f-ac" checked><span>必須有冷氣</span></label></div>
    </div>
    <div class="group">
      <h3>🍽️ 種類（可複選）</h3>
      <div class="opts" id="f-cats"></div>
    </div>
    <div id="count">符合條件：<b id="count-num">0</b> 間</div>
    <div id="hint"></div>
    <button class="btn btn-primary" id="btn-spin">開始決策！</button>
    <p id="note">※ 距離為依 AI3 所在的軟體園區估算之直線約略值，實際請以 Google 地圖為準；餐廳清單可直接修改程式內的 RESTAURANTS 陣列。拖曳輪盤可手動旋轉。</p>
  </div>

  <!-- 結果彈窗層 -->
  <div id="result-modal" class="hidden">
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="r-name">
      <div class="tag-top">🎉 今天中午就吃</div>
      <h2 id="r-name"></h2>
      <div class="dist" id="r-dist"></div>
      <div class="tags" id="r-tags"></div>
      <div class="memo" id="r-note"></div>
      <div class="actions">
        <a class="btn btn-nav" id="r-nav" target="_blank" rel="noopener">🗺️ 開啟 Google 地圖導航</a>
        <div class="row">
          <button class="btn btn-secondary" id="r-again">🔄 不滿意，再抽一次</button>
          <button class="btn btn-secondary" id="r-refilter">⚙️ 重新篩選</button>
        </div>
      </div>
    </div>
  </div>

  <script>
  // ============ 1. 餐廳資料庫 (AI3 方圓 2km 內清單) ============
  // distanceMeters 為估算值；可自行增修。googleMapUrl 以「店名＋南港」搜尋連結產生。
  const CATS = ['麵','飯','鍋貼/水餃','漢堡/美式','湯包/小吃','健康餐/沙拉','火鍋/鍋物','日式'];
  const mk = (id,name,d,ac,cats,price,note) => ({
    id, name, distanceMeters:d, hasAC:ac, categories:cats,
    googleMapUrl:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(name+' 南港'),
    priceRange:price, note:note||''
  });
  const RESTAURANTS = [
    mk('rest_001','樂法 Le Phu',300,true,['漢堡/美式','健康餐/沙拉'],'$','漢堡、美式、輕食'),
    mk('rest_002','gonna 共樂遊 南港店',450,true,['飯','麵','健康餐/沙拉'],'$$','中信金融園區內，地中海慢食'),
    mk('rest_003','Coppii Lumii 咖啡早午餐',600,true,['漢堡/美式','健康餐/沙拉'],'$$','早午餐與甜點，用餐時段可能要排隊'),
    mk('rest_004','涮嘴 南港店',700,true,['火鍋/鍋物'],'$$','小火鍋，內用白飯飲料吃到飽'),
    mk('rest_005','LaLaport 南港 美食區',800,true,['日式','飯','麵','湯包/小吃'],'$$','三井購物園區，選擇多、適合意見分歧時'),
    mk('rest_006','朱記餡餅粥店 (南港環球店)',1200,true,['麵','飯','鍋貼/水餃'],'$$','餡餅、粥品、麵飯'),
    mk('rest_007','好好食房 南港店 (CITYLINK)',1900,true,['飯','麵'],'$$','雞湯套餐'),
    mk('rest_008','靜岡勝政 日式豬排 (CITYLINK)',1900,true,['飯','日式'],'$$$','日式豬排套餐'),
    mk('rest_009','紅豆小館 (CITYLINK)',1900,true,['飯','麵','湯包/小吃'],'$$','台港風味小吃'),
    mk('rest_010','YAYOI 彌生軒 (南港車站)',1900,true,['飯','日式'],'$$','日式定食'),
    mk('rest_011','新江南拉麵 16 鋪 (南港車站)',1900,true,['麵'],'$$','拉麵專門店'),
    mk('rest_012','22:02 火鍋樂活 (CITYLINK)',1900,true,['火鍋/鍋物'],'$$$','養生蔬果火鍋'),
    mk('rest_013','賭城嫩雞 (CITYLINK)',1900,true,['漢堡/美式'],'$$','酥炸嫩雞柳')
  ];

  // ============ 狀態與 UI 元素 ============
  const $ = id => document.getElementById(id);
  const catBox = $('f-cats');
  CATS.forEach(c => {
    const l = document.createElement('label');
    l.innerHTML = '<input type="checkbox" value="'+c+'" checked><span>'+c+'</span>';
    catBox.appendChild(l);
  });
  let current = [];            // 目前符合條件的餐廳
  let spinning = false, idle = true, spinAnim = null, winnerIdx = -1;

  // ============ 4. 篩選條件過濾邏輯 ============
  function getFilters(){
    return {
      dist: +document.querySelector('input[name=dist]:checked').value,
      ac: $('f-ac').checked,
      cats: [...catBox.querySelectorAll('input:checked')].map(i => i.value)
    };
  }
  function filterRestaurants(f){
    return RESTAURANTS.filter(r =>
      r.distanceMeters <= f.dist &&
      (!f.ac || r.hasAC) &&
      r.categories.some(c => f.cats.includes(c)));
  }

  // ============ 2. Three.js 場景、相機、渲染器、燈光 ============
  const container = $('canvas-container');
  let renderer;
  try{
    renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
  }catch(e){
    container.innerHTML = '<div id="nowebgl">此瀏覽器未啟用 WebGL，無法顯示 3D 輪盤。請改用最新版 Chrome / Edge / Safari / Firefox。</div>';
    throw e;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  container.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);
  camera.position.set(0, 0.4, 16);
  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.35);
  dirLight.position.set(5, 8, 12); scene.add(dirLight);
  const warm = new THREE.PointLight(0xffc98a, 0.25, 80);
  warm.position.set(-10, 4, 9); scene.add(warm);

  // 背景星塵
  (function(){
    const n = 260, pos = new Float32Array(n*3);
    for(let i=0;i<n;i++){
      pos[i*3] = (Math.random()-.5)*70; pos[i*3+1] = (Math.random()-.5)*40; pos[i*3+2] = -8 - Math.random()*25;
    }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos,3));
    scene.add(new THREE.Points(g, new THREE.PointsMaterial({color:0xaab4ff,size:.12,transparent:true,opacity:.7})));
  })();

  // ============ 3. 動態 3D 輪盤（Canvas 動態繪製文字貼圖）============
  const R = 5, DEPTH = 0.6;
  const PALETTE = ['#ff6b6b','#ffa94d','#fcc419','#69db7c','#38d9a9','#4dabf7','#9775fa','#f783ac'];
  const wheelRoot = new THREE.Group();
  const spinner = new THREE.Group();
  wheelRoot.add(spinner); scene.add(wheelRoot);
  wheelRoot.rotation.x = -0.42;                 // 微微後仰，增加立體感

  // 固定不轉的部件：外框、底盤、中心軸、指針
  const rim = new THREE.Mesh(new THREE.TorusGeometry(R+0.2, 0.2, 16, 96),
    new THREE.MeshStandardMaterial({color:0xf5d27a, metalness:.7, roughness:.3}));
  rim.position.z = DEPTH/2; wheelRoot.add(rim);
  const base = new THREE.Mesh(new THREE.CylinderGeometry(R+0.35, R+0.35, 0.3, 64),
    new THREE.MeshStandardMaterial({color:0x22244f, metalness:.4, roughness:.6}));
  base.rotation.x = Math.PI/2; base.position.z = -0.25; wheelRoot.add(base);
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(.6,.6,.5,32),
    new THREE.MeshStandardMaterial({color:0xf5d27a, metalness:.8, roughness:.25}));
  hub.rotation.x = Math.PI/2; hub.position.z = DEPTH+0.2; wheelRoot.add(hub);
  const pointer = new THREE.Mesh(new THREE.ConeGeometry(.42,1.0,24),
    new THREE.MeshStandardMaterial({color:0xff3b5c, emissive:0x550015, metalness:.3, roughness:.4}));
  pointer.rotation.z = Math.PI;                  // 尖端朝下
  pointer.position.set(0, R+0.55, DEPTH+0.35); wheelRoot.add(pointer);

  function disposeObj(o){
    o.traverse(c => {
      if(c.geometry) c.geometry.dispose();
      if(c.material){ if(c.material.map) c.material.map.dispose(); c.material.dispose(); }
    });
  }
  function makeLabelTexture(text, w, h){
    const cw = 512, ch = Math.max(64, Math.round(512*h/w));
    const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
    const ctx = cv.getContext('2d');
    const font = s => 'bold '+s+'px "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
    let size = Math.floor(ch*0.62), pad = 24, maxW = cw - pad*2;
    ctx.font = font(size);
    while(ctx.measureText(text).width > maxW && size > 22){ size -= 2; ctx.font = font(size); }
    if(ctx.measureText(text).width > maxW){          // 仍過長 → 加省略號
      while(text.length > 2 && ctx.measureText(text+'…').width > maxW) text = text.slice(0,-1);
      text += '…';
    }
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(4, size*.16);
    ctx.strokeStyle = 'rgba(30,20,60,.75)'; ctx.fillStyle = '#fff';
    ctx.strokeText(text, cw-pad, ch/2+2); ctx.fillText(text, cw-pad, ch/2+2);
    const tex = new THREE.CanvasTexture(cv);
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return tex;
  }

  let sectorGroups = [];
  function buildWheel(list){
    while(spinner.children.length){ const c = spinner.children[0]; spinner.remove(c); disposeObj(c); }
    sectorGroups = []; winnerIdx = -1;
    const empty = list.length === 0;
    const items = empty ? [{name:'沒有符合條件的餐廳'}] : list;
    const n = items.length, seg = Math.PI*2/n, gap = n>1 ? 0.008 : 0;
    items.forEach((it,i) => {
      const a0 = i*seg + gap, a1 = (i+1)*seg - gap;
      const shape = new THREE.Shape();
      shape.moveTo(0,0); shape.absarc(0,0,R,a0,a1,false); shape.lineTo(0,0);
      const geo = new THREE.ExtrudeGeometry(shape,{depth:DEPTH, bevelEnabled:true, bevelThickness:.04, bevelSize:.04, bevelSegments:2, curveSegments:Math.max(6,Math.ceil(36/n))});
      let idx = i % PALETTE.length;
      if(n>1 && i===n-1 && idx===0) idx = 4;       // 避免首尾同色
      const col = empty ? '#6b6f8d' : PALETTE[idx];
      const mat = new THREE.MeshStandardMaterial({color:new THREE.Color(col), metalness:0, roughness:.8});
      const g = new THREE.Group();
      g.add(new THREE.Mesh(geo, mat));
      // 文字貼圖
      const mid = (i+0.5)*seg, rMid = R*0.6, L = R*0.74;
      const h = Math.min(1.25, 2*rMid*Math.sin(Math.min(seg/2,Math.PI/2))*0.82);
      const label = new THREE.Mesh(new THREE.PlaneGeometry(L, h),
        new THREE.MeshBasicMaterial({map:makeLabelTexture(it.name, L, h), transparent:true}));
      label.position.set(Math.cos(mid)*rMid, Math.sin(mid)*rMid, DEPTH+0.07);
      label.rotation.z = mid;
      g.add(label);
      g.userData.center = mid;
      spinner.add(g); sectorGroups.push(g);
    });
  }
  function highlight(i){
    sectorGroups.forEach((g,k) => {
      const on = k === i;
      g.position.z = on ? 0.45 : 0;
      g.children[0].material.emissive.setHex(on ? 0x555533 : 0x000000);
    });
  }

  // ============ 粒子（Confetti）============
  let confetti = null;
  function launchConfetti(){
    if(confetti){ scene.remove(confetti.points); disposeObj(confetti.points); }
    const N = 220, pos = new Float32Array(N*3), col = new Float32Array(N*3), vel = [];
    const c = new THREE.Color();
    for(let i=0;i<N;i++){
      pos.set([0, 2.5, 4], i*3);
      c.set(PALETTE[i%PALETTE.length]); col.set([c.r,c.g,c.b], i*3);
      const a = Math.random()*Math.PI*2, up = 6 + Math.random()*9, sp = 2 + Math.random()*5;
      vel.push(new THREE.Vector3(Math.cos(a)*sp, up, Math.sin(a)*sp*.6 + 2));
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos,3));
    g.setAttribute('color', new THREE.BufferAttribute(col,3));
    const m = new THREE.PointsMaterial({size:.28, vertexColors:true, transparent:true, opacity:1, depthWrite:false});
    const points = new THREE.Points(g,m); scene.add(points);
    confetti = {points, vel, life:0};
  }
  function updateConfetti(dt){
    if(!confetti) return;
    confetti.life += dt;
    const p = confetti.points.geometry.attributes.position, v = confetti.vel;
    for(let i=0;i<v.length;i++){
      v[i].y -= 14*dt;
      p.setXYZ(i, p.getX(i)+v[i].x*dt, p.getY(i)+v[i].y*dt, p.getZ(i)+v[i].z*dt);
    }
    p.needsUpdate = true;
    confetti.points.material.opacity = Math.max(0, 1 - Math.max(0, confetti.life-1.6)/1.2);
    if(confetti.life > 3){ scene.remove(confetti.points); disposeObj(confetti.points); confetti = null; }
  }

  // ============ 5. 轉動動畫與 Ease-Out 演算法 ============
  const easeOutCubic = t => 1 - Math.pow(1-t, 3);
  function spin(){
    if(spinning || !current.length) return;
    closeModal();
    highlight(-1);
    const n = current.length, seg = Math.PI*2/n;
    const idx = Math.floor(Math.random()*n);                      // 先抽中，再讓輪盤停在該格
    const center = (idx+0.5)*seg + (Math.random()-.5)*seg*0.6;    // 格內隨機偏移，避免每次都正中
    const target = Math.PI/2 - center;                             // 指針在 12 點鐘方向 (π/2)
    const cur = spinner.rotation.z, TAU = Math.PI*2;
    let delta = ((target-cur)%TAU + TAU) % TAU;
    delta += TAU * (5 + Math.floor(Math.random()*2));              // 多轉 5~6 圈
    spinAnim = {start:performance.now(), dur:3000, from:cur, delta, idx};
    spinning = true; idle = false;
    $('btn-spin').disabled = true;
  }
  function finishSpin(){
    const idx = spinAnim.idx; spinAnim = null; spinning = false; winnerIdx = idx;
    highlight(idx);
    launchConfetti();
    setTimeout(() => showModal(current[idx]), 700);
    $('btn-spin').disabled = current.length === 0;
  }

  // ============ 6. UI 事件監聽與結果呈現 ============
  function showModal(r){
    $('r-name').textContent = r.name;
    $('r-dist').textContent = r.distanceMeters + ' 公尺，步行約 ' + Math.max(1,Math.round(r.distanceMeters/80)) + ' 分鐘';
    const tags = [];
    if(r.hasAC) tags.push('❄️ 有冷氣');
    r.categories.forEach(c => tags.push(c));
    tags.push('價位 ' + r.priceRange);
    $('r-tags').innerHTML = '';
    tags.forEach(t => { const s = document.createElement('span'); s.textContent = t; $('r-tags').appendChild(s); });
    $('r-note').textContent = r.note;
    $('r-nav').href = r.googleMapUrl;
    $('result-modal').classList.remove('hidden');
  }
  function closeModal(){ $('result-modal').classList.add('hidden'); }

  function refresh(){
    const f = getFilters();
    current = filterRestaurants(f);
    $('count-num').textContent = current.length;
    $('count').classList.toggle('zero', current.length === 0);
    $('hint').textContent = current.length === 0 ? '⚠️ 沒有符合的餐廳，請放寬篩選條件' : '';
    $('btn-spin').disabled = current.length === 0 || spinning;
    spinAnim = null; spinning = false; idle = true;
    closeModal(); buildWheel(current);
  }
  $('ui-container').addEventListener('change', refresh);
  $('btn-spin').addEventListener('click', spin);
  $('r-again').addEventListener('click', () => { closeModal(); spin(); });
  $('r-refilter').addEventListener('click', () => { closeModal(); $('ui-container').scrollTo({top:0,behavior:'smooth'}); });
  $('result-modal').addEventListener('click', e => { if(e.target.id === 'result-modal') closeModal(); });
  window.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });

  // 滑鼠 / 觸控拖曳旋轉輪盤
  let drag = null;
  container.addEventListener('pointerdown', e => {
    if(spinning) return;
    drag = {x:e.clientX}; idle = false; container.classList.add('dragging');
    container.setPointerCapture(e.pointerId);
  });
  container.addEventListener('pointermove', e => {
    if(!drag) return;
    spinner.rotation.z += (e.clientX - drag.x) * 0.008; drag.x = e.clientX;
  });
  const endDrag = () => { drag = null; container.classList.remove('dragging'); };
  container.addEventListener('pointerup', endDrag);
  container.addEventListener('pointercancel', endDrag);

  // 版面自適應：讓輪盤落在側欄以外的可視區域中央
  function resize(){
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h); camera.aspect = w/h; camera.updateProjectionMatrix();
    const hVis = 2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2))*camera.position.z;
    const wVis = hVis*camera.aspect;
    if(w > 760){
      const side = $('ui-container').offsetWidth + 40;
      const shift = (side/2)/w*wVis;
      const s = Math.min(1, (wVis - side/w*wVis)/12.2, (hVis*0.92)/12.4);
      wheelRoot.scale.setScalar(s); wheelRoot.position.set(shift, -0.3, 0);
    }else{
      const s = Math.min(1, wVis/12.4, (hVis*0.52)/12.4);
      wheelRoot.scale.setScalar(s); wheelRoot.position.set(0, hVis*0.2, 0);
    }
  }
  window.addEventListener('resize', resize);

  // 主迴圈
  let last = performance.now();
  function animate(now){
    requestAnimationFrame(animate);
    const dt = Math.min(0.05, (now-last)/1000); last = now;
    if(spinAnim){
      const t = Math.min(1, (now-spinAnim.start)/spinAnim.dur);
      spinner.rotation.z = spinAnim.from + spinAnim.delta*easeOutCubic(t);
      if(t >= 1) finishSpin();
    }else if(idle){
      spinner.rotation.z += 0.12*dt;                 // 微弱旋轉
    }
    wheelRoot.rotation.y = Math.sin(now/1800)*0.12;  // 輕微擺動
    updateConfetti(dt);
    renderer.render(scene, camera);
  }

  resize(); refresh(); requestAnimationFrame(animate);
  </script>
</body>
</html>
